# Kitty Terminal Configuration
# S4vitar Style para Hyprland

# === FUENTE ===
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 13.0

# === TAMAÑO DE VENTANA ===
window_padding_width 10

# === TEMA DE COLORES (Synapse-Purple) ===
# Fondo y texto principal
foreground #c0caf5
background #0D0D16

# Colores normales
color0 #0D0D16
color1 #ff2e63
color2 #00ff9f
color3 #ffb86c
color4 #00d4ff
color5 #bb9af7
color6 #00d4ff
color7 #c0caf5

# Colores brillantes
color8  #414868
color9  #ff5f87
color10 #00ff9f
color11 #ffc777
color12 #00e5ff
color13 #c7a9ff
color14 #00e5ff
color15 #e0e0ff

# === CURSOR ===
cursor #00ff9f
cursor_text_color #0D0D16
cursor_shape block
cursor_blink_interval 0.5

# === SELECCIÓN ===
selection_foreground #0D0D16
selection_background #00ff9f

# === URL ===
url_color #00d4ff
underlined_url_color #bb9af7

# === BARRA DE PESTAÑAS (si usas tabs) ===
active_tab_font_family JetBrainsMono Nerd Font Bold
inactive_tab_font_family JetBrainsMono Nerd Font
active_tab_foreground #0D0D16
active_tab_background #00ff9f
inactive_tab_foreground #6b7a8f
inactive_tab_background #1a1a2e
tab_bar_background #0D0D16

# === SCROLLBAR ===
scrollback_lines 10000
wheel_scroll_min_content_height 200

# === TECLADO ===
# Distribución en español latinoamericano
kitty_mod ctrl+shift

# Atajos personalizados
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+move_window_left move_window_left
map ctrl+shift+move_window_right move_window_right
map ctrl+shift+move_window_top move_window_top
map ctrl+shift+move_window_bottom move_window_bottom

# === MOUSE ===
copy_on_select yes
strip_trailing_spaces smart

# === BELL ===
enable_audio_bell no
visual_bell_color #ff2e63

# === RENDERING ===
repaint_delay 10
sync_to_monitor yes
disable_ligatures never

# === ENVIRONMENT ===
env KITTY_WINDOW_ID=1

# === SHELL INTEGRATION (opcional) ===
# shell_integration no_rc

# === LINUX ONLY ===
wayland_titlebar_color system
hide_window_decorations titlebar-and-borders

# === DEBUG ===
# debug_font_boxes no
# debug_opengl no

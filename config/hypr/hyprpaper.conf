# Hyprpaper Configuration
# Fondos de pantalla para Hyprland

# Precargar imágenes
preload = ~/.config/hypr/wallpapers/default.jpg

# Establecer wallpaper
wallpaper = ,~/.config/hypr/wallpapers/default.jpg

# Si tienes múltiples monitores:
# wallpaper = DP-1,~/.config/hypr/wallpapers/default.jpg
# wallpaper = eDP-1,~/.config/hypr/wallpapers/default-laptop.jpg

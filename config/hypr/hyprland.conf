# =============================================================================
# Hyprland Configuration - S4vitar Style
# Para Parrot Security OS 7.x
# ASUS TUF Dash F15 - 2026
# =============================================================================

# --- VARIABLES ---
$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun --style ~/.config/wofi/style.css
$filemanager = dolphin
$browser = firefox

# --- MONITORES ---
# Monitor principal con resolución nativa
monitor=,preferred,auto,1

# Si usas múltiples monitores, descomenta y ajusta:
# monitor=DP-1,1920x1080@144,0x0,1
# monitor=eDP-1,1920x1080@60,1920x0,1

# --- AUTOSTART ---
# Gestor de fondos de pantalla
exec-once = hyprpaper

# Barra de tareas
exec-once = waybar

# Notificaciones
exec-once = dunst

# Agente de polkit (para contraseñas de administrador)
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Applet de red
exec-once = nm-applet --indicator

# Cursor theme
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Adwaita'

# Script de estado de seguridad (si existe)
exec-once = sleep 2 && ~/.config/hypr/scripts/security_status.sh

# --- APARIENCIA ---
general {
    # Bordes y gaps
    gaps_in = 4
    gaps_out = 8
    border_size = 3
    
    # Colores de bordes (gradiente verde-cyan)
    col.active_border = rgb(00ff9f) rgb(00d4ff) 90deg
    col.inactive_border = rgba(58, 58, 92, 170)
    
    # Layout de ventanas
    layout = dwindle
    
    # Mostrar bordes en ventanas flotantes
    no_border_on_floating = false
    
    # Grupos
    group_border = rgb(00ff9f)
    group_border_active = rgb(00d4ff)
}

# --- DECORACIONES ---
decoration {
    # Bordes redondeados
    rounding = 6
    
    # Blur (efecto de desenfoque)
    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.2
        new_optimizations = true
        contrast = 1.0
        brightness = 1.0
        noise = 0.0
    }
    
    # Sombra
    drop_shadow = true
    shadow_range = 8
    shadow_render_power = 3
    col.shadow = rgba(0, 0, 0, 180)
    shadow_offset = 0 4
    
    # Dimming de ventanas inactivas
    dim_inactive = false
    dim_strength = 0.1
}

# --- ANIMACIONES ---
animations {
    enabled = true
    
    # Curvas de animación personalizadas
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.34, 1.56, 0.64, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = softOvershot, 0.05, .56, .07, .98
    
    # Animaciones específicas
    animation = windows, 1, 5, easeOutQuint, slide
    animation = windowsIn, 1, 5, easeOutQuint, slide
    animation = windowsOut, 1, 5, easeOutQuint, slide
    animation = border, 1, 3, default
    animation = borderangle, 1, 30, overshot, loop
    animation = fade, 1, 4, smoothIn
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 3, easeInOutCubic, fade
    animation = workspaces, 1, 4, easeOutQuint, slide
    animation = workspacesIn, 1, 4, easeOutQuint, slide
    animation = workspacesOut, 1, 4, easeOutQuint, slide
    animation = specialWorkspace, 1, 5, easeOutQuint, slideup
}

# --- LAYOUT DWINDLE ---
dwindle {
    # Pseudo-tiling (ventanas cuadradas cuando es posible)
    pseudotile = true
    
    # Mantener división al cerrar ventanas
    preserve_split = true
    
    # División inteligente
    smart_split = true
    smart_resizing = true
    
    # Sin gaps cuando solo hay una ventana
    no_gaps_when_only = 0
    
    # Usar ventana activa para splits
    use_active_for_splits = true
    
    # Padding
    default_split_ratio = 1.0
    split_width_multiplier = 1.0
    split_height_multiplier = 1.0
}

# --- LAYOUT MASTER ---
master {
    new_status = master
    mfact = 0.55
}

# --- INPUT (TECLADO/TOUCHPAD) ---
input {
    # Distribución de teclado en español latinoamericano
    kb_layout = latam
    
    # Seguir el mouse
    follow_mouse = 1
    
    # Sensibilidad del mouse
    sensitivity = 0
    
    # Touchpad
    touchpad {
        natural_scroll = true
        tap_to_click = true
        scroll_method = two_finger
        clickfinger_behavior = true
        middle_button_emulation = false
    }
    
    # Teclas de acceso rápido para repetición
    repeat_rate = 50
    repeat_delay = 300
}

# --- CURSOR ---
cursor {
    # Sin aceleración por hardware (mejor compatibilidad)
    no_hardware_cursors = true
    
    # Monitor principal
    default_monitor = 1
    
    # Tema del cursor
    default_size = 24
}

# --- KEYBINDINGS ---

# === BÁSICOS ===
# Terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, T, exec, $terminal

# Cerrar ventana activa
bind = $mainMod SHIFT, Q, killactive,

# Salir de Hyprland
bind = $mainMod SHIFT, E, exit,

# Launcher (menú de aplicaciones)
bind = $mainMod, D, exec, $menu

# Navegador
bind = $mainMod SHIFT, B, exec, $browser

# Administrador de archivos
bind = $mainMod, E, exec, $filemanager

# Toggle floating/tiling
bind = $mainMod, V, togglefloating,

# Pseudo-tiling
bind = $mainMod, P, pseudo,

# Split (horizontal/vertical)
bind = $mainMod, J, togglesplit,

# Pantalla completa
bind = $mainMod, F, fullscreen,

# === FOCUS (MOVERSE ENTRE VENTANAS) ===
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# También con HJKL (estilo Vim)
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# === WORKSPACES ===
# Ir a workspace 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Mover ventana a workspace 1-10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll entre workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod CTRL, left, workspace, e-1
bind = $mainMod CTRL, right, workspace, e+1

# === SPECIAL WORKSPACE (SCRATCHPAD) ===
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, S, movetoworkspace, special:scratchpad

# === MOVER/REDIMENSIONAR CON MOUSE ===
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# === SISTEMA DE VENTANAS DINÁMICAS ===
# Window Snap (tipo Windows)
bind = $mainMod SHIFT, left, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh left
bind = $mainMod SHIFT, right, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh right
bind = $mainMod SHIFT, up, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh top
bind = $mainMod SHIFT, down, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh bottom

# Window Snap - Esquinas (cuartos de pantalla)
bind = $mainMod CTRL, left, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh top_left
bind = $mainMod CTRL, right, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh top_right
bind = $mainMod CTRL SHIFT, left, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh bottom_left
bind = $mainMod CTRL SHIFT, right, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh bottom_right

# Window Snap - Tercios de pantalla
bind = $mainMod ALT, left, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh third_left
bind = $mainMod ALT, right, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh third_right

# Window Snap - Pantalla completa
bind = $mainMod, Z, exec, ~/.config/hypr/scripts/window_tools/window_snap.sh full

# Mover ventana a coordenadas específicas
bind = $mainMod CTRL SHIFT, K, exec, ~/.config/hypr/scripts/window_tools/window_move.sh 0 0
bind = $mainMod CTRL SHIFT, J, exec, ~/.config/hypr/scripts/window_tools/window_move.sh center center

# Redimensionar ventana a tamaños predefinidos
bind = $mainMod CTRL, K, exec, ~/.config/hypr/scripts/window_tools/window_resize.sh half half
bind = $mainMod CTRL, J, exec, ~/.config/hypr/scripts/window_tools/window_resize.sh full full

# Layouts - Guardar y cargar
bind = $mainMod SHIFT, G, exec, ~/.config/hypr/scripts/window_tools/window_layout.sh save current
bind = $mainMod, G, exec, ~/.config/hypr/scripts/window_tools/window_layout.sh load current

# === VOLUMEN ===
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# === BRILLO DE PANTALLA ===
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# === CAPTURAS DE PANTALLA ===
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod, Print, exec, grim ~/Pictures/screenshot-full-$(date +%Y%m%d-%H%M%S).png

# === UTILIDADES ===
# Portapapeles (si usas cliphist)
# bind = $mainMod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Bloquear pantalla
bind = $mainMod SHIFT, L, exec, hyprlock

# Cambiar opacidad de ventana
bind = $mainMod CTRL, O, exec, hyprctl keyword windowrule "opacity 1.0 1.0, class:.*"

# === MEDIA KEYS ===
bind = , Play, exec, playerctl play-pause
bind = , Next, exec, playerctl next
bind = , Previous, exec, playerctl previous
bind = , Stop, exec, playerctl stop

# --- WINDOW RULES ---
# Ventanas flotantes por defecto
windowrule = float, title:(Floating)
windowrule = center, title:(Floating)

# Opacidad
windowrulev2 = opacity 0.93 0.93, class:.*

# Forzar bordes en todas las ventanas
windowrulev2 = bordercolor rgb(00ff9f), class:.*

# Ventanas específicas
windowrule = float, org.gnome.Calculator
windowrule = center, org.gnome.Calculator
windowrule = float, pavucontrol
windowrule = size 800 600, pavucontrol
windowrule = center, pavucontrol

# --- GESTURES ---
gestures {
    workspace_swipe = true
    workspace_swipe_distance = 500
    workspace_swipe_fingers = 3
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_forever = false
    workspace_swipe_use_r = false
}

# --- MISC ---
misc {
    # Desactivar logo de Hyprland
    disable_hyprland_logo = true
    disable_splash_rendering = true
    
    # Forzar wallpaper por defecto
    force_default_wallpaper = 0
    
    # VFR (Variable Frame Rate)
    vfr = true
    
    # VRR (Variable Refresh Rate)
    vrr = 0
    
    # Animación de foco
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    
    # Middle click paste
    enable_swallow = false
    
    # Focus en nueva ventana
    new_window_takes_keyboard_focus = true
}

# --- DEBUG ---
# debug {
